# Ein Dienst: nginx liefert die statische Seite aus, sonst nichts.
#
# Start:  docker compose up -d --build --remove-orphans
#
# --remove-orphans raeumt den frueheren Mail-Weiterleiter (anmeldung) ab,
# falls er auf dem Server noch laeuft; das Formular gibt es nicht mehr.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    # Protokolle begrenzen. Ohne diese Angabe wächst das Docker-Log
    # unbegrenzt, bis die Platte voll ist. Zugriffe schreibt nginx gar nicht
    # mehr mit (access_log off, siehe Dockerfile); übrig bleiben echte Fehler
    # und die Startmeldungen — die sind hier gedeckelt.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
