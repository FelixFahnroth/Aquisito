# Zwei Dienste: der Webserver wie bisher, dazu der kleine Mail-Weiterleiter
# für das Freiwilligen-Formular. nginx reicht /api/anmeldung an ihn weiter,
# alles andere bleibt statisch.
#
# Start:  docker compose up -d --build
#
# Die Zugangsdaten stehen in .env (nicht im Repo, siehe .env.example). Fehlt
# die Datei, startet trotzdem alles — nur das Absenden des Formulars meldet
# dann einen Fehler, statt dass die ganze Seite nicht hochkommt.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - anmeldung

  anmeldung:
    build: ./api
    restart: unless-stopped
    # Kein ports-Eintrag: der Dienst ist nur im internen Netz erreichbar,
    # von außen kommt man ausschließlich über nginx an ihn heran.
    #
    # Bewusst kein env_file: fehlt die .env, bricht "docker compose up" damit
    # komplett ab. Compose liest .env im Projektordner ohnehin automatisch für
    # ${...} ein, und eine fehlende Datei ist dabei kein Fehler — die Defaults
    # unten greifen dann einfach.
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.strato.de}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-info@aquisito.de}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-info@aquisito.de}
      MAIL_TO: ${MAIL_TO:-info@aquisito.de}
